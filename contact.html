<!DOCTYPE html>
<html lang="en">
<head>
  <title>OBMC Contact Us</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="styles.css" rel="stylesheet">

  <style>
    body{
      background-image: url(wallpaper.png);
      background-size: cover;
    }
  </style>

</head>
<body>


<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="logo.png" alt="logo" height="50px" width=""></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html" target="_self">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html" target="_self" >About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="enroll.html" target="_self" >Enroll</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html" target="_self" >Contact Us</a>
        </li>
      </ul>
      <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Search">
        <button class="btn btn-primary" type="button">Search</button>
      </form>
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">

  <div class="row">
    <div class="one col sm-4 m-3 p-3 rounded">
      <div class="bg-white rounded p-2 mb-3">
        <h2 style="text-align: center;"> School Office Hours</h2>
      </div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Office Hours</th>
                        <th scope="col">Department</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="col">Monday</th>
                        <td>8AM - 4PM</td>
                        <td>Registrar's Office</td>
                    </tr>
                    <tr>
                        <th scope="col">Tuesday</th>
                        <td>8AM - 4PM</td>
                        <td>Accounting Office</td>
                    </tr>
                    <tr>
                        <th scope="col">Wednesday</th>
                        <td>8AM - 4PM</td>
                        <td>Guidance Office</td>
                    </tr>
                    <tr>
                        <th scope="col">Thursday</th>
                        <td>8AM - 4PM</td>
                        <td>Principal's Office</td>
                    </tr>
                    <tr>
                        <th scope="col">Friday</th>
                        <td>8AM - 4PM</td>
                        <td>Admin Office</td>
                    </tr>
                </tbody>
            </table>
    </div>

  <div class="two col sm-4 m-3 p-3 bg-white rounded">
    <div class="container mt-3">
            <h2 style="text-align: center;">Contact Us</h2>
            <form>
                <div class="mb-3 mt-3">
                    <label for="name">Full Name</label>
                    <input type="name" class="form-control" id="name" placeholder="Enter your full name" name="name">
                </div>
                <div class="mb-3 mt-3">
                    <label for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email address" name="email">
                </div>
                <div class="mb-3 mt-3">
                    <label for="subject">Subject</label>
                    <input type="subject" class="form-control" id="subject" placeholder="Enter your subject" name="subject">
                </div>
                <div>
                  <label for="textarea">Message</label> <br>
                  <textarea id="textarea" name="message" rows="4" class="form-control" placeholder="Type your message here"></textarea>
                </div>

                <div style="justify-self: center;">
                  <button type="submit" class="btn btn-primary mt-3">Send Message</button>
                </div>
            </form>
    </div>
  </div>



</div>

</body>
</html>
